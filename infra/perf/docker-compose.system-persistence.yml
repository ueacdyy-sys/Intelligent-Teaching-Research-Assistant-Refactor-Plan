      postgres
      -c max_connections=160
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
    ports:
      - "15434:5432"
    volumes:
      - system_teaching_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d intelligent_teaching_assistant"]
