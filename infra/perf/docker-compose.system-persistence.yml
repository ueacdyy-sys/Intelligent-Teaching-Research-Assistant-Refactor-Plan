name: ita-system-persistence-runtime

services:
  system-identity-postgres:
    image: postgres:18-alpine
    container_name: ita-system-identity-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ueacd
      POSTGRES_DB: intelligent_teaching_assistant
      POSTGRES_INITDB_ARGS: "-E UTF8"
    command: >
      postgres
      -c max_connections=160
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
    ports:
      - "15432:5432"
    volumes:
      - system_identity_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d intelligent_teaching_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  system-identity-pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ita-system-identity-pgbouncer
    ports:
      - "16432:6432"
    volumes:
      - ./system-identity-pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./identity-session-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      system-identity-postgres:
        condition: service_healthy

  system-conversation-postgres:
