openapi: 3.1.0
info:
  title: Identity And Access API
  version: 0.1.0
  description: Contract for teacher, student, and remote command identity.
servers:
  - url: http://127.0.0.1:18100
paths:
  /v1/identity/sessions/password:
    post:
      operationId: createPasswordSession
      summary: Create a teacher, student, or admin session with a password.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSessionRequest'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/sessions/wechat:
    post:
      operationId: startWeChatSession
      summary: Start a WeChat QR login session for teacher or admin users.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatSessionStartRequest'
      responses:
        '202':
          description: WeChat login started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatSessionStartResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/sessions/wechat/callback:
    post:
      operationId: completeWeChatSession
      summary: Complete a WeChat QR login session.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatSessionCallbackRequest'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and return a fresh principal context.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Session refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session.
      tags: [identity]
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/identity/principal:
    get:
      operationId: getPrincipal
      summary: Resolve the current principal context.
      tags: [identity]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/identity/remote-command-grants:
    post:
      operationId: createRemoteCommandGrant
      summary: Exchange a verified mobile or social channel assertion for a remote command grant.
      tags: [identity]
      security:
        - ChannelSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteCommandGrantRequest'
      responses:
        '201':
          description: Remote command grant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandGrantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ChannelSignature:
      type: apiKey
      in: header
      name: X-Channel-Signature
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated principal is not allowed to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PasswordSessionRequest:
      type: object
      additionalProperties: false
      required: [identifier, password, entryPoint]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128
        requestedRole:
          $ref: '#/components/schemas/Role'
        entryPoint:
          $ref: '#/components/schemas/EntryPoint'
    WeChatSessionStartRequest:
      type: object
      additionalProperties: false
      required: [entryPoint]
      properties:
        requestedRole:
          type: string
          enum: [TEACHER, ADMIN]
        entryPoint:
          type: string
          enum: [DESKTOP_TEACHER, DESKTOP_RESEARCH]
        redirectUri:
          type:
            - string
            - 'null'
    WeChatSessionStartResponse:
      type: object
      additionalProperties: false
      required: [state, authUrl, expiresAt]
      properties:
        state:
          type: string
          minLength: 8
        authUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    WeChatSessionCallbackRequest:
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        state:
          type: string
          minLength: 8
        code:
          type: string
          minLength: 1
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    RemoteCommandGrantRequest:
      type: object
      additionalProperties: false
      required: [provider, externalSubjectId, commandPreview, nonce, issuedAt]
      properties:
        provider:
          type: string
          enum: [WECHAT, QQ, TELEGRAM, LOCAL_PAIRING, OTHER]
        externalSubjectId:
          type: string
          minLength: 1
        commandPreview:
          type: string
          minLength: 1
          maxLength: 2000
        nonce:
          type: string
          minLength: 8
          description: Unique request nonce per provider and external subject. Reuse is rejected as a replay.
        issuedAt:
          type: string
          format: date-time
          description: Channel-issued timestamp. Requests outside the gateway freshness window are rejected.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn, principal]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
        principal:
          $ref: '#/components/schemas/PrincipalContext'
    PrincipalResponse:
      type: object
      additionalProperties: false
      required: [principal]
      properties:
        principal:
          $ref: '#/components/schemas/PrincipalContext'
    RemoteCommandGrantResponse:
      type: object
      additionalProperties: false
      required: [grantToken, expiresAt, principal]
      properties:
        grantToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        principal:
          $ref: '#/components/schemas/PrincipalContext'
    PrincipalContext:
      type: object
      additionalProperties: false
      required:
        - principalId
        - subjectType
        - role
        - entryPoint
        - scopes
        - knowledgeAccess
        - studentAccess
        - requiresHarnessApproval
        - sessionId
        - issuedAt
        - expiresAt
      properties:
        principalId:
          type: string
        subjectType:
          type: string
          enum: [USER, REMOTE_CHANNEL, SERVICE]
        role:
          $ref: '#/components/schemas/Role'
        entryPoint:
          $ref: '#/components/schemas/EntryPoint'
        displayName:
          type:
            - string
            - 'null'
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        knowledgeAccess:
          $ref: '#/components/schemas/KnowledgeAccess'
        studentAccess:
          $ref: '#/components/schemas/StudentAccess'
        channel:
          type:
            - object
            - 'null'
          additionalProperties: true
        requiresHarnessApproval:
          type: boolean
        sessionId:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Role:
      type: string
      enum: [TEACHER, STUDENT, ADMIN, REMOTE_OPERATOR, SERVICE]
    EntryPoint:
      type: string
      enum: [DESKTOP_TEACHER, DESKTOP_RESEARCH, STUDENT_APP, REMOTE_SOCIAL, AGENT_INTERNAL]
    Scope:
      type: string
      enum:
        - IDENTITY_READ
        - TEACHING_READ
        - TEACHING_WRITE
        - RESEARCH_READ
        - RESEARCH_WRITE
        - STUDENT_OWN_READ
        - STUDENT_OWN_WRITE
        - STUDENT_ASSIGNED_READ
        - STUDENT_ARCHIVE_WRITE
        - KNOWLEDGE_PUBLIC_READ
        - KNOWLEDGE_PRIVATE_READ
        - AGENT_COMMAND_SUBMIT
        - HARNESS_APPROVE
        - DEVICE_LOCAL_CONTROL
        - ADMIN_SYSTEM
    KnowledgeAccess:
      type: object
      additionalProperties: false
      required: [public, private]
      properties:
        public:
          type: boolean
        private:
          type: string
          enum: [NONE, OWN, ASSIGNED, ALL]
    StudentAccess:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [NONE, OWN, ASSIGNED, ALL]
        studentIds:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type:
                - object
                - 'null'
