StudentAppArchiveItemSearchSummaryOnlyResponse:
  type: object
  additionalProperties: false
  required:
    - summary
  properties:
    summary:
      $ref: '#/StudentAppArchiveItemSearchSummary'

StudentAppArchiveItemSearchSummary:
  type: object
  additionalProperties: false
  required:
    - totalCount
    - quizCount
    - paperCount
    - handoutCount
    - homeworkCount
  properties:
    totalCount:
      type: integer
      minimum: 0
    quizCount:
      type: integer
      minimum: 0
    paperCount:
      type: integer
      minimum: 0
    handoutCount:
      type: integer
      minimum: 0
    homeworkCount:
      type: integer
      minimum: 0
