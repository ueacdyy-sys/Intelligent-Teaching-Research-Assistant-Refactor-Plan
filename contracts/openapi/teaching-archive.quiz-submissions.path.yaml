post:
  operationId: createTeachingQuizSubmission
  summary: Record metadata-only student answer submission for a teaching quiz.
  tags: [teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: archiveItemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tarch_[A-Za-z0-9_-]+$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - answerRef
          properties:
            studentId:
              type: string
              minLength: 1
              maxLength: 128
            answerRef:
              type: string
              minLength: 1
              maxLength: 1000
  responses:
    '201':
      description: Quiz submission metadata recorded.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - id
              - quizArchiveItemId
              - studentId
              - submittedByPrincipalId
              - answerRef
              - status
              - submittedAt
            properties:
              id:
                type: string
                pattern: '^quiz_sub_[A-Za-z0-9_-]+$'
              quizArchiveItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              studentId:
                type: string
                minLength: 1
                maxLength: 128
              submittedByPrincipalId:
                type: string
                minLength: 1
              answerRef:
                type: string
                minLength: 1
                maxLength: 1000
              status:
                type: string
                const: SUBMITTED
              submittedAt:
                type: string
                format: date-time
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '404':
      $ref: './teaching-archive.yaml#/components/responses/NotFound'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
