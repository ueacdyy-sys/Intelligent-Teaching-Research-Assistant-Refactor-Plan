get:
  operationId: readStudentAppArchiveItemsSearchSummary
  summary: Read count-only published archive material summary for the authenticated student's own search.
  tags: [student-app, teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: materialType
      in: query
      required: false
      schema:
        $ref: './teaching-archive.yaml#/components/schemas/StudentArchiveMaterialType'
    - name: query
      in: query
      required: false
      description: Safe metadata search text scoped to the authenticated student's published archive materials.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    - name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Private ETag validator returned by the Student App archive material summary.
  responses:
    '200':
      description: Count-only published archive material summary visible to the Student App.
      headers:
        ETag:
          description: Private response validator for Student App archive material summary.
          schema:
            type: string
            pattern: '^"sha256-[A-Za-z0-9_-]+"$'
        Cache-Control:
          description: Student-owned material summaries must be revalidated before reuse.
          schema:
            type: string
            enum: ['private, no-cache']
        Vary:
          description: Response varies by authenticated principal context and agent API key.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: './teaching-archive.student-app-archive-items-summary.schema.yaml#/StudentAppArchiveItemSearchSummaryOnlyResponse'
    '304':
      description: Archive material summary unchanged for the supplied If-None-Match validator.
      headers:
        ETag:
          description: Current private response validator.
          schema:
            type: string
            pattern: '^"sha256-[A-Za-z0-9_-]+"$'
        Cache-Control:
          description: Student-owned material summaries must be revalidated before reuse.
          schema:
            type: string
            enum: ['private, no-cache']
        Vary:
          description: Response varies by authenticated principal context and agent API key.
          schema:
            type: string
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
