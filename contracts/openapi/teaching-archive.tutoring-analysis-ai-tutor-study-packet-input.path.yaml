post:
  operationId: readTeachingAITutorWorkerStudyPacketInput
  summary: Read worker-only SAFE_TEXT_BLOCKS input for a claimed Student App AI Tutor request.
  tags: [teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tutor_req_[A-Za-z0-9_-]+$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [workerId]
          properties:
            workerId:
              type: string
              minLength: 1
              maxLength: 128
  responses:
    '200':
      description: Worker-only AI Tutor study packet input package.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - requestId
              - archiveItemId
              - analysisGoal
              - questionBankIntent
              - status
              - learningActionSource
              - workerId
              - claimExpiresAt
              - sourceArchiveStudentId
              - sourceArchiveMaterial
              - renderFormat
              - blocks
            properties:
              requestId:
                type: string
                pattern: '^tutor_req_[A-Za-z0-9_-]+$'
              archiveItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              analysisGoal:
                type: string
                minLength: 1
                maxLength: 500
              questionBankIntent:
                $ref: './teaching-archive.yaml#/components/schemas/QuestionBankIntent'
              status:
                type: string
                const: IN_PROGRESS
              learningActionSource:
                type: string
                enum: [PUBLISHED_STUDY_PACKET, AI_TUTOR_RESULT_ARCHIVE]
              followUpDepth:
                type: integer
                minimum: 1
                maximum: 2
              workerId:
                type: string
                minLength: 1
                maxLength: 128
              claimExpiresAt:
                type: string
                format: date-time
              sourceArchiveStudentId:
                type: string
                minLength: 1
              sourceArchiveMaterial:
                $ref: './teaching-archive.yaml#/components/schemas/ArchiveMaterialType'
              packetStatus:
                type: string
                const: READY
              resultArchiveStatus:
                type: string
                const: READY_FOR_STUDENT_APP_READ
              resultArchiveSourceItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              renderFormat:
                type: string
                const: SAFE_TEXT_BLOCKS
              blocks:
                type: array
                minItems: 1
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  required: [blockId, blockType, title, text]
                  properties:
                    blockId: { type: string, minLength: 1, maxLength: 128 }
                    blockType:
                      type: string
                      enum: [SECTION, SUMMARY, GUIDANCE_SECTION]
                    sectionId: { type: string, minLength: 1, maxLength: 128 }
                    title: { type: string, minLength: 1, maxLength: 1200 }
                    text: { type: string, minLength: 1, maxLength: 1200 }
                    pageHint: { type: string, maxLength: 80 }
                    sourceBlockRefs:
                      type: array
                      maxItems: 16
                      items:
                        type: string
                        minLength: 1
                        maxLength: 128
            oneOf:
              - required:
                  - packetStatus
                properties:
                  learningActionSource:
                    type: string
                    const: PUBLISHED_STUDY_PACKET
                not:
                  anyOf:
                    - required: [resultArchiveStatus]
                    - required: [followUpDepth]
              - required:
                  - resultArchiveStatus
                  - followUpDepth
                  - resultArchiveSourceItemId
                properties:
                  learningActionSource:
                    type: string
                    const: AI_TUTOR_RESULT_ARCHIVE
                not:
                  required: [packetStatus]
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '404':
      $ref: './teaching-archive.yaml#/components/responses/NotFound'
    '409':
      $ref: './teaching-archive.yaml#/components/responses/Conflict'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
