post:
  operationId: readTeachingAIGradingQuestionBankAnswerScoringInput
  summary: Read worker-only scoring input for a claimed question-bank draft answer AI grading request.
  tags: [teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^grading_req_[A-Za-z0-9_-]+$'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [workerId]
          properties:
            workerId:
              type: string
              minLength: 1
              maxLength: 128
  responses:
    '200':
      description: Worker-only answer scoring input package.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - requestId
              - archiveItemId
              - gradingInstructions
              - status
              - workerId
              - claimExpiresAt
              - sourceArchiveStudentId
              - sourceQuestionBankDraftRef
              - sourceQuestionBankAnswerSubmissionId
              - sourceArchiveMaterial
              - tutoringAnalysisRequestId
              - items
            properties:
              requestId:
                type: string
                pattern: '^grading_req_[A-Za-z0-9_-]+$'
              archiveItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              gradingInstructions:
                type: string
                minLength: 1
                maxLength: 1000
              rubricRef:
                type: [string, 'null']
              status:
                type: string
                const: IN_PROGRESS
              workerId:
                type: string
                minLength: 1
                maxLength: 128
              claimExpiresAt:
                type: string
                format: date-time
              sourceArchiveStudentId:
                type: string
                minLength: 1
              sourceQuestionBankDraftRef:
                type: string
                minLength: 1
                maxLength: 1000
              sourceQuestionBankAnswerSubmissionId:
                type: string
                pattern: '^qbank_ans_sub_[A-Za-z0-9_-]+$'
              sourceArchiveMaterial:
                $ref: './teaching-archive.yaml#/components/schemas/ArchiveMaterialType'
              tutoringAnalysisRequestId:
                type: string
                pattern: '^tutor_req_[A-Za-z0-9_-]+$'
              items:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [itemId, questionText, answerText, expectedAnswer, explanation]
                  properties:
                    itemId: { type: string, minLength: 1, maxLength: 128 }
                    questionText: { type: string, minLength: 1, maxLength: 2000 }
                    answerText: { type: string, maxLength: 4000 }
                    expectedAnswer: { type: string, minLength: 1, maxLength: 2000 }
                    explanation: { type: string, minLength: 1, maxLength: 4000 }
                    learningTarget: { type: string, maxLength: 200 }
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '404':
      $ref: './teaching-archive.yaml#/components/responses/NotFound'
    '409':
      $ref: './teaching-archive.yaml#/components/responses/Conflict'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
