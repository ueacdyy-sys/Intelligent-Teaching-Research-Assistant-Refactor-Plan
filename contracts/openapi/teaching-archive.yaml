openapi: 3.1.0
info:
  title: Teaching Archive Gateway
  version: 0.1.0
  description: Contract for Teaching Mode archive material metadata intake.
servers:
  - url: http://127.0.0.1:18120
paths:
  /v1/teaching/archive-items:
    $ref: './teaching-archive.archive-items.path.yaml'
  /v1/teaching/archive-items/{archiveItemId}/tutoring-analysis-requests:
    $ref: './teaching-archive.archive-item-tutoring-analysis-requests.path.yaml'
  /v1/teaching/archive-items/{archiveItemId}/ai-grading-requests:
    $ref: './teaching-archive.archive-item-ai-grading-requests.path.yaml'
  /v1/teaching/archive-items/{archiveItemId}/quiz-submissions:
    $ref: './teaching-archive.quiz-submissions.path.yaml'
  /v1/teaching/archive-items/{archiveItemId}/quiz-submissions/{submissionId}/ai-grading-requests:
    $ref: './teaching-archive.quiz-submission-ai-grading-requests.path.yaml'
  /v1/teaching/quiz-draft-intents:
    $ref: './teaching-archive.quiz-draft-intents.path.yaml'
  /v1/teaching/archive-material-draft-intents:
    $ref: './teaching-archive.archive-material-draft-intents.path.yaml'
  /v1/teaching/quiz-scan-submissions:
    $ref: './teaching-archive.quiz-scan-submissions.path.yaml'
  /v1/student-app/teaching-materials:
    $ref: './teaching-archive.student-app-teaching-materials.path.yaml'
  /v1/student-app/archive-items:
    $ref: './teaching-archive.student-app-archive-items.path.yaml'
  /v1/student-app/quiz-submissions:
    $ref: './teaching-archive.student-app-quiz-submissions.path.yaml'
  /v1/student-app/quiz-scan-submissions:
    $ref: './teaching-archive.student-app-quiz-scan-submissions.path.yaml'
  /v1/student-app/question-bank-drafts:
    $ref: './teaching-archive.student-app-question-bank-drafts.path.yaml'
  /v1/student-app/question-bank-draft-content:
    $ref: './teaching-archive.student-app-question-bank-draft-content.path.yaml'
  /v1/student-app/question-bank-draft-answer-submissions:
    $ref: './teaching-archive.student-app-question-bank-draft-answer-submissions.path.yaml'
  /v1/student-app/question-bank-draft-answer-submissions/{submissionId}/ai-grading-requests:
    $ref: './teaching-archive.student-app-question-bank-draft-answer-submission-ai-grading-requests.path.yaml'
  /v1/student-app/question-bank-draft-answer-submissions/{submissionId}/ai-grading-result:
    $ref: './teaching-archive.student-app-question-bank-draft-answer-submission-ai-grading-result.path.yaml'
  /v1/student-app/ai-tutor-requests:
    $ref: './teaching-archive.student-app-ai-tutor-requests.path.yaml'
  /v1/teaching/attendance-sessions:
    $ref: './teaching-archive.attendance-sessions.path.yaml'
  /v1/teaching/attendance-sessions/{sessionId}/records:
    $ref: './teaching-archive.attendance-session-records.path.yaml'
  /v1/teaching/attendance-sessions/{sessionId}/sign-ins:
    $ref: './teaching-archive.attendance-session-sign-ins.path.yaml'
  /v1/teaching/attendance-sessions/{sessionId}/end:
    $ref: './teaching-archive.attendance-session-end.path.yaml'
  /v1/teaching/attendance-sessions/{sessionId}/random-selections:
    $ref: './teaching-archive.attendance-session-random-selections.path.yaml'
  /v1/teaching/students/{studentId}/attendance-records:
    $ref: './teaching-archive.student-attendance-records.path.yaml'
  /v1/teaching/attendance-statistics:
    $ref: './teaching-archive.attendance-statistics.path.yaml'
  /v1/teaching/ai-grading-requests:
    $ref: './teaching-archive.ai-grading-requests.path.yaml'
  /v1/teaching/ai-grading-requests/worker-claims:
    $ref: './teaching-archive.ai-grading-worker-claims.path.yaml'
  /v1/teaching/ai-grading-requests/{requestId}/question-bank-answer-scoring-input:
    $ref: './teaching-archive.ai-grading-question-bank-answer-scoring-input.path.yaml'
  /v1/teaching/ai-grading-requests/{requestId}/worker-result:
    $ref: './teaching-archive.ai-grading-worker-result.path.yaml'
  /v1/teaching/tutoring-analysis-requests:
    $ref: './teaching-archive.tutoring-analysis-requests.path.yaml'
  /v1/teaching/tutoring-analysis-requests/worker-claims:
    $ref: './teaching-archive.tutoring-analysis-worker-claims.path.yaml'
  /v1/teaching/tutoring-analysis-requests/{requestId}/worker-result:
    $ref: './teaching-archive.tutoring-analysis-worker-result.path.yaml'
components:
  securitySchemes:
    AgentApiKey:
      type: apiKey
      in: header
      name: X-Agent-Api-Key
    PrincipalContextHeader:
      type: apiKey
      in: header
      name: X-Principal-Context
  responses:
    Unauthorized:
      description: Invalid or missing API key or principal context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal is not allowed to access the requested archive data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested archive item was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Requested state transition conflicts with the current tutoring analysis request status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request body or archive metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateArchiveItemRequest:
      type: object
      additionalProperties: false
      required:
        - ownerType
        - materialType
        - title
        - source
        - contentRef
        - analysisIntents
      properties:
        ownerType:
          $ref: '#/components/schemas/ArchiveOwnerType'
        studentId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        materialType:
          $ref: '#/components/schemas/ArchiveMaterialType'
        title:
          type: string
          minLength: 1
          maxLength: 200
        source:
          $ref: '#/components/schemas/ArchiveSource'
        contentRef:
          type: string
          minLength: 1
          maxLength: 1000
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
        analysisIntents:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/ArchiveAnalysisIntent'
        ocrReserved:
          type: boolean
          default: false
    CreateTutoringAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - analysisGoal
      properties:
        analysisGoal:
          type: string
          minLength: 1
          maxLength: 500
        questionBankIntent:
          $ref: '#/components/schemas/QuestionBankIntent'
          default: NONE
    CreateStudentAppAITutorRequest:
      type: object
      additionalProperties: false
      required:
        - studentArchiveItemId
        - analysisGoal
      properties:
        studentArchiveItemId:
          type: string
          minLength: 1
          maxLength: 1000
        analysisGoal:
          type: string
          minLength: 1
          maxLength: 500
        questionBankIntent:
          $ref: '#/components/schemas/QuestionBankIntent'
          default: GENERATE_PERSONALIZED_CHECK
    CreateAIGradingRequest:
      type: object
      additionalProperties: false
      required:
        - gradingInstructions
      properties:
        gradingInstructions:
          type: string
          minLength: 1
          maxLength: 1000
        rubricRef:
          type: string
          minLength: 1
          maxLength: 1000
    ClaimTutoringAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - workerId
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        leaseSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
    RecordTutoringAnalysisResultRequest:
      oneOf:
        - $ref: '#/components/schemas/RecordTutoringAnalysisSucceededRequest'
        - $ref: '#/components/schemas/RecordTutoringAnalysisFailedRequest'
      discriminator:
        propertyName: status
        mapping:
          SUCCEEDED: '#/components/schemas/RecordTutoringAnalysisSucceededRequest'
          FAILED: '#/components/schemas/RecordTutoringAnalysisFailedRequest'
    RecordTutoringAnalysisSucceededRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - workerId
        - resultSummary
        - resultRef
      properties:
        status:
          type: string
          const: SUCCEEDED
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        resultSummary:
          type: string
          minLength: 1
          maxLength: 2000
        resultRef:
          type: string
          minLength: 1
          maxLength: 1000
        questionBankDraftRef:
          type: string
          minLength: 1
          maxLength: 1000
    RecordTutoringAnalysisFailedRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - workerId
        - errorMessage
      properties:
        status:
          type: string
          const: FAILED
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        errorCode:
          type: string
          minLength: 1
          maxLength: 64
        errorMessage:
          type: string
          minLength: 1
          maxLength: 1000
    ArchiveItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerType
        - materialType
        - title
        - source
        - contentRef
        - tags
        - analysisIntents
        - ocrStatus
        - createdAt
      properties:
        id:
          type: string
          pattern: '^tarch_[A-Za-z0-9_-]+$'
        ownerType:
          $ref: '#/components/schemas/ArchiveOwnerType'
        studentId:
          type:
            - string
            - 'null'
        materialType:
          $ref: '#/components/schemas/ArchiveMaterialType'
        title:
          type: string
        source:
          $ref: '#/components/schemas/ArchiveSource'
        contentRef:
          type: string
        tags:
          type: array
          items:
            type: string
        analysisIntents:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveAnalysisIntent'
        ocrStatus:
          type: string
          enum: [RESERVED, NOT_REQUIRED]
        createdAt:
          type: string
          format: date-time
    ArchiveItemListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pageInfo
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveItemResponse'
        pageInfo:
          $ref: '#/components/schemas/ArchivePageInfo'
    ArchivePageInfo:
      type: object
      additionalProperties: false
      required:
        - pageSize
        - hasMore
        - nextCursor
      properties:
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
        nextCursor:
          type:
            - string
            - 'null'
    TutoringAnalysisRequestListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pageInfo
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TutoringAnalysisRequestResponse'
        pageInfo:
          $ref: '#/components/schemas/ArchivePageInfo'
    AIGradingRequestListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pageInfo
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AIGradingRequestResponse'
        pageInfo:
          $ref: '#/components/schemas/ArchivePageInfo'
    AIGradingRequestResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - archiveItemId
        - requestedByPrincipalId
        - gradingInstructions
        - status
        - sourceArchiveOwnerType
        - sourceArchiveContentRef
        - sourceArchiveMaterial
        - sourceArchiveOcrStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^grading_req_[A-Za-z0-9_-]+$'
        archiveItemId:
          type: string
          pattern: '^tarch_[A-Za-z0-9_-]+$'
        requestedByPrincipalId:
          type: string
          minLength: 1
        gradingInstructions:
          type: string
        rubricRef:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/AIGradingStatus'
        sourceArchiveOwnerType:
          $ref: '#/components/schemas/ArchiveOwnerType'
        sourceArchiveStudentId:
          type:
            - string
            - 'null'
        sourceArchiveContentRef:
          type: string
          minLength: 1
          maxLength: 1000
        sourceQuizSubmissionId: { type: [string, 'null'] }
        sourceAnswerRef: { type: [string, 'null'], maxLength: 1000 }
        sourceQuestionBankDraftRef: { type: [string, 'null'], maxLength: 1000 }
        sourceQuestionBankAnswerSubmissionId: { type: [string, 'null'] }
        sourceArchiveMaterial:
          $ref: '#/components/schemas/ArchiveMaterialType'
        sourceArchiveOcrStatus:
          type: string
          enum: [RESERVED, NOT_REQUIRED]
        scoreSummary: { type: [string, 'null'] }
        resultRef: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        claimedByWorkerId:
          type:
            - string
            - 'null'
        claimExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt:
          type: string
          format: date-time
    TutoringAnalysisWorkerClaimResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - archiveItemId
        - analysisGoal
        - questionBankIntent
        - status
        - sourceArchiveOwnerType
        - sourceArchiveMaterial
        - claimedByWorkerId
        - claimExpiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^tutor_req_[A-Za-z0-9_-]+$'
        archiveItemId:
          type: string
          pattern: '^tarch_[A-Za-z0-9_-]+$'
        analysisGoal:
          type: string
        questionBankIntent:
          $ref: '#/components/schemas/QuestionBankIntent'
        status:
          type: string
          const: IN_PROGRESS
        sourceArchiveOwnerType:
          $ref: '#/components/schemas/ArchiveOwnerType'
        sourceArchiveStudentId:
          type:
            - string
            - 'null'
        sourceArchiveMaterial:
          $ref: '#/components/schemas/ArchiveMaterialType'
        claimedByWorkerId:
          type: string
        claimExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TutoringAnalysisRequestResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - archiveItemId
        - requestedByPrincipalId
        - analysisGoal
        - questionBankIntent
        - status
        - sourceArchiveOwnerType
        - sourceArchiveMaterial
        - createdAt
      properties:
        id:
          type: string
          pattern: '^tutor_req_[A-Za-z0-9_-]+$'
        archiveItemId:
          type: string
          pattern: '^tarch_[A-Za-z0-9_-]+$'
        requestedByPrincipalId:
          type: string
          minLength: 1
        analysisGoal:
          type: string
        questionBankIntent:
          $ref: '#/components/schemas/QuestionBankIntent'
        status:
          $ref: '#/components/schemas/TutoringAnalysisStatus'
        sourceArchiveOwnerType:
          $ref: '#/components/schemas/ArchiveOwnerType'
        sourceArchiveStudentId:
          type:
            - string
            - 'null'
        sourceArchiveMaterial:
          $ref: '#/components/schemas/ArchiveMaterialType'
        resultSummary:
          type:
            - string
            - 'null'
        resultRef:
          type:
            - string
            - 'null'
        questionBankDraftRef:
          type:
            - string
            - 'null'
        errorCode:
          type:
            - string
            - 'null'
        errorMessage:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    ArchiveOwnerType:
      type: string
      enum: [STUDENT, TEACHING]
    ArchiveMaterialType:
      type: string
      enum: [QUIZ, PAPER, HANDOUT, HOMEWORK, TEACHING_MATERIAL]
    StudentArchiveMaterialType:
      type: string
      enum: [QUIZ, PAPER, HANDOUT, HOMEWORK]
    ArchiveSource:
      type: string
      enum: [TEACHER_UPLOAD, STUDENT_UPLOAD, SYSTEM_IMPORT]
    ArchiveAnalysisIntent:
      type: string
      enum: [TUTORING, AI_GRADING, ARCHIVE_ONLY]
    QuestionBankIntent:
      type: string
      enum: [NONE, GENERATE_PERSONALIZED_CHECK]
    AIGradingStatus:
      type: string
      enum: [QUEUED, IN_PROGRESS, SUCCEEDED, FAILED]
    TutoringAnalysisStatus:
      type: string
      enum: [QUEUED, IN_PROGRESS, SUCCEEDED, FAILED]
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
