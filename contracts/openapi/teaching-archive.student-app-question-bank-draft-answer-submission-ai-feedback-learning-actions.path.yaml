get:
  operationId: readStudentAppQuestionBankDraftAnswerFeedbackLearningActions
  summary: Read safe learning action affordances for reviewed question-bank answer feedback.
  tags: [student-app, teaching-archive, ai-tutor]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: submissionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^qbank_ans_sub_[A-Za-z0-9_-]+$'
        maxLength: 1000
  responses:
    '200':
      description: Safe action affordances for the authenticated student's own reviewed feedback.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - submissionId
              - archiveItemId
              - feedbackArchiveItemId
              - status
              - materialType
              - renderFormat
              - actions
            properties:
              submissionId:
                type: string
                pattern: '^qbank_ans_sub_[A-Za-z0-9_-]+$'
              archiveItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              feedbackArchiveItemId:
                type: string
                pattern: '^tarch_[A-Za-z0-9_-]+$'
              status:
                type: string
                const: READY_FOR_STUDENT_APP_READ
              materialType:
                type: string
                const: HOMEWORK
              renderFormat:
                type: string
                const: SAFE_TEXT_BLOCKS
              actions:
                type: array
                minItems: 0
                maxItems: 8
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - actionType
                    - state
                    - targetEndpoint
                    - method
                    - requiresTutorRequest
                    - learningActionSource
                  properties:
                    actionType:
                      type: string
                      enum: [AI_TUTOR_REQUEST, PERSONALIZED_QUESTION_BANK]
                    state:
                      type: string
                      enum: [AVAILABLE, DEFERRED_THROUGH_AI_TUTOR]
                    targetEndpoint:
                      type: string
                      const: /v1/student-app/ai-tutor-requests
                    method:
                      type: string
                      const: POST
                    questionBankIntent:
                      type: string
                      const: GENERATE_PERSONALIZED_CHECK
                    requiresTutorRequest:
                      type: boolean
                      const: true
                    learningActionSource:
                      type: object
                      additionalProperties: false
                      required:
                        - sourceType
                        - actionType
                        - submissionId
                        - feedbackStatus
                        - feedbackRenderFormat
                      properties:
                        sourceType:
                          type: string
                          const: QUESTION_BANK_DRAFT_ANSWER_FEEDBACK
                        actionType:
                          type: string
                          enum: [AI_TUTOR_REQUEST, PERSONALIZED_QUESTION_BANK]
                        submissionId:
                          type: string
                          pattern: '^qbank_ans_sub_[A-Za-z0-9_-]+$'
                        feedbackStatus:
                          type: string
                          const: READY_FOR_STUDENT_APP_READ
                        feedbackRenderFormat:
                          type: string
                          const: SAFE_TEXT_BLOCKS
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '404':
      $ref: './teaching-archive.yaml#/components/responses/NotFound'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
