get:
  operationId: listStudentAppTeachingMaterials
  summary: List teaching material metadata for Student App clients.
  tags: [student-app, teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  responses:
    '200':
      description: Teaching material metadata page visible to the Student App.
      content:
        application/json:
          schema:
            $ref: './teaching-archive.yaml#/components/schemas/ArchiveItemListResponse'
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
