get:
  operationId: listStudentAppArchiveItems
  summary: List the authenticated student's own learning archive metadata.
  tags: [student-app, teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: materialType
      in: query
      required: false
      schema:
        $ref: './teaching-archive.yaml#/components/schemas/StudentArchiveMaterialType'
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  responses:
    '200':
      description: Student-owned archive metadata page visible to the Student App.
      content:
        application/json:
          schema:
            $ref: './teaching-archive.yaml#/components/schemas/ArchiveItemListResponse'
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
