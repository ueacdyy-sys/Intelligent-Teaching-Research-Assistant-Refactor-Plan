get:
  operationId: listStudentAppAITutorRequests
  summary: List AI tutor jobs for the authenticated student's own archive materials.
  tags: [student-app, teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  parameters:
    - name: status
      in: query
      required: false
      schema:
        $ref: './teaching-archive.yaml#/components/schemas/TutoringAnalysisStatus'
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    - name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Private ETag validator returned by the Student App AI Tutor progress list.
  responses:
    '200':
      description: AI tutor job page visible to the Student App.
      headers:
        ETag:
          description: Private response validator for Student App conditional polling.
          schema:
            type: string
            pattern: '^"sha256-[A-Za-z0-9_-]+"$'
        Cache-Control:
          description: Student-owned progress responses must be revalidated before reuse.
          schema:
            type: string
            enum: ['private, no-cache']
        Vary:
          description: Response varies by authenticated principal context and agent API key.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: './teaching-archive.student-app-ai-tutor-request-progress.schema.yaml#/StudentAppAITutorRequestProgressListResponse'
    '304':
      description: AI tutor job page unchanged for the supplied If-None-Match validator.
      headers:
        ETag:
          description: Current private response validator.
          schema:
            type: string
            pattern: '^"sha256-[A-Za-z0-9_-]+"$'
        Cache-Control:
          description: Student-owned progress responses must be revalidated before reuse.
          schema:
            type: string
            enum: ['private, no-cache']
        Vary:
          description: Response varies by authenticated principal context and agent API key.
          schema:
            type: string
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
post:
  operationId: createStudentAppAITutorRequest
  summary: Queue an AI tutor analysis job for the authenticated student's archive material.
  tags: [student-app, teaching-archive]
  security:
    - AgentApiKey: []
      PrincipalContextHeader: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './teaching-archive.yaml#/components/schemas/CreateStudentAppAITutorRequest'
  responses:
    '201':
      description: AI tutor job queued as a tutoring analysis request.
      content:
        application/json:
          schema:
            $ref: './teaching-archive.yaml#/components/schemas/TutoringAnalysisRequestResponse'
    '401':
      $ref: './teaching-archive.yaml#/components/responses/Unauthorized'
    '403':
      $ref: './teaching-archive.yaml#/components/responses/Forbidden'
    '404':
      $ref: './teaching-archive.yaml#/components/responses/NotFound'
    '422':
      $ref: './teaching-archive.yaml#/components/responses/ValidationError'
