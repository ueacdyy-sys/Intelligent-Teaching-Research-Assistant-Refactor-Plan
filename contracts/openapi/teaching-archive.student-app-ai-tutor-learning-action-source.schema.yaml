type: object
additionalProperties: false
properties:
  sourceType:
    type: string
    enum: [PUBLISHED_STUDY_PACKET, AI_TUTOR_RESULT_ARCHIVE]
    default: PUBLISHED_STUDY_PACKET
  actionType:
    type: string
    enum: [AI_TUTOR_REQUEST, PERSONALIZED_QUESTION_BANK]
  packetStatus:
    type: string
    const: READY
  resultArchiveStatus:
    type: string
    const: READY_FOR_STUDENT_APP_READ
  renderFormat:
    type: string
    const: SAFE_TEXT_BLOCKS
  followUpDepth:
    type: integer
    minimum: 1
    maximum: 2
oneOf:
  - required:
      - actionType
      - packetStatus
    properties:
      sourceType:
        type: string
        enum: [PUBLISHED_STUDY_PACKET]
        default: PUBLISHED_STUDY_PACKET
    not:
      anyOf:
        - required: [resultArchiveStatus]
        - required: [renderFormat]
        - required: [followUpDepth]
  - required:
      - sourceType
      - actionType
      - resultArchiveStatus
      - renderFormat
      - followUpDepth
    properties:
      sourceType:
        type: string
        const: AI_TUTOR_RESULT_ARCHIVE
    not:
      required: [packetStatus]
