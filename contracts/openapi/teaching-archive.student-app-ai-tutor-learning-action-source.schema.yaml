type: object
additionalProperties: false
properties:
  sourceType:
    type: string
    enum: [PUBLISHED_STUDY_PACKET, AI_TUTOR_RESULT_ARCHIVE, QUESTION_BANK_DRAFT_ANSWER_FEEDBACK]
    default: PUBLISHED_STUDY_PACKET
  actionType:
    type: string
    enum: [AI_TUTOR_REQUEST, PERSONALIZED_QUESTION_BANK]
  packetStatus:
    type: string
    const: READY
  resultArchiveStatus:
    type: string
    const: READY_FOR_STUDENT_APP_READ
  renderFormat:
    type: string
    const: SAFE_TEXT_BLOCKS
  followUpDepth:
    type: integer
    minimum: 1
    maximum: 2
  submissionId:
    type: string
    pattern: '^qbank_ans_sub_[A-Za-z0-9_-]+$'
  feedbackStatus:
    type: string
    const: READY_FOR_STUDENT_APP_READ
  feedbackRenderFormat:
    type: string
    const: SAFE_TEXT_BLOCKS
oneOf:
  - required:
      - actionType
      - packetStatus
    properties:
      sourceType:
        type: string
        enum: [PUBLISHED_STUDY_PACKET]
        default: PUBLISHED_STUDY_PACKET
    not:
      anyOf:
        - required: [resultArchiveStatus]
        - required: [renderFormat]
        - required: [followUpDepth]
        - required: [submissionId]
        - required: [feedbackStatus]
        - required: [feedbackRenderFormat]
  - required:
      - sourceType
      - actionType
      - resultArchiveStatus
      - renderFormat
      - followUpDepth
    properties:
      sourceType:
        type: string
        const: AI_TUTOR_RESULT_ARCHIVE
    not:
      anyOf:
        - required: [packetStatus]
        - required: [submissionId]
        - required: [feedbackStatus]
        - required: [feedbackRenderFormat]
  - required:
      - sourceType
      - actionType
      - submissionId
      - feedbackStatus
      - feedbackRenderFormat
    properties:
      sourceType:
        type: string
        const: QUESTION_BANK_DRAFT_ANSWER_FEEDBACK
    not:
      anyOf:
        - required: [packetStatus]
        - required: [resultArchiveStatus]
        - required: [renderFormat]
        - required: [followUpDepth]
